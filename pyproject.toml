[project]
name = "apron-tools"
dynamic = ["version"]
description = "Agent-ready provider API wrappers with typed schemas, OAuth scope mappings, and LLM function-calling definitions."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
all = [
    "apron-tools[atlassian]",
    "apron-tools[github]",
    "apron-tools[google]",
    "apron-tools[google-tasks]",
    "apron-tools[hubspot]",
    "apron-tools[linear]",
    "apron-tools[microsoft]",
    "apron-tools[microsoft-onedrive]",
    "apron-tools[notion]",
    "apron-tools[powerpoint]",
    "apron-tools[salesforce]",
    "apron-tools[slack]",
    "apron-tools[typeform]",
    "apron-tools[web-access]",
    "apron-tools[word]",
]

atlassian = ["atlassian-python-api>=3.0"]
github = ["PyGithub>=2.0"]
google = ["google-api-python-client>=2.0"]
google-tasks = []
hubspot = []
linear = []
microsoft = ["msgraph-sdk>=1.0"]
microsoft-onedrive = []
notion = ["notion-client>=2.0"]
powerpoint = ["python-pptx>=1.0"]
salesforce = ["simple-salesforce>=1.0"]
slack = ["slack_sdk[optional]>=3.0"]
typeform = []
web-access = ["tabstack>=2.2.0"]
word = ["python-docx>=1.0"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "ty>=0.0.56",
]
tests = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "setuptools>=82.0",
    "setuptools-scm[toml]>=9.2",
]

[build-system]
requires = ["setuptools>=48", "setuptools_scm[toml]>=6.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call real provider APIs (require credentials)",
]
