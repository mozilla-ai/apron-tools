[project]
name = "any-tool"
dynamic = ["version"]
description = "Agent-ready provider API wrappers with typed schemas, OAuth scope mappings, and LLM function-calling definitions."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
all = [
    "any-tool[atlassian]",
    "any-tool[github]",
    "any-tool[google]",
    "any-tool[linear]",
    "any-tool[microsoft]",
    "any-tool[notion]",
    "any-tool[salesforce]",
    "any-tool[slack]",
    "any-tool[typeform]",
]

atlassian = ["atlassian-python-api>=3.0"]
github = ["PyGithub>=2.0"]
google = ["google-api-python-client>=2.0"]
linear = []
microsoft = ["msgraph-sdk>=1.0"]
notion = ["notion-client>=2.0"]
salesforce = ["simple-salesforce>=1.0"]
slack = ["slack_sdk[optional]>=3.0"]
typeform = []

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "ty>=0.0.23",
]
tests = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "setuptools>=82.0",
    "setuptools-scm[toml]>=9.2",
]

[build-system]
requires = ["setuptools>=48", "setuptools_scm[toml]>=6.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call real provider APIs (require credentials)",
]
